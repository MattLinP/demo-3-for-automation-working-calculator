<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>計算機</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: ui-monospace, Consolas, monospace; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
  #tape { list-style: none; padding: 0; min-height: 6rem; }
  #tape li { padding: .15rem 0; }
  #tape li b { font-weight: 600; }
  #expression { width: 100%; font: inherit; font-size: 1.25rem; padding: .4rem .5rem; box-sizing: border-box; }
  #preview { min-height: 1.5rem; opacity: .6; padding: .25rem .5rem; }
</style>
</head>
<body>
<main>
  <ol id="tape"></ol>
  <input id="expression" autofocus autocomplete="off" spellcheck="false"
         aria-label="算式" placeholder="輸入算式,Enter 求值">
  <div id="preview" aria-live="polite"></div>
</main>
<script src="core.js"></script>
<script>
  // 介面只做顯示與事件;求值一律呼叫 core.js(docs/adr/0001)。
  "use strict";
  const input = document.getElementById("expression");
  const preview = document.getElementById("preview");
  const tape = document.getElementById("tape");
  let ans; // 紙帶最後一筆條目的結果

  input.addEventListener("input", () => {
    try {
      preview.textContent = "= " + evaluate(input.value, ans);
    } catch {
      preview.textContent = "";
    }
  });

  input.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    let result;
    try {
      result = evaluate(input.value, ans);
    } catch {
      return; // 尚不構成條目,留在輸入框裡繼續編輯
    }
    const entry = document.createElement("li");
    const bold = document.createElement("b");
    bold.textContent = " = " + result;
    entry.textContent = input.value;
    entry.appendChild(bold);
    tape.appendChild(entry);
    ans = result;
    input.value = "";
    preview.textContent = "";
  });
</script>
</body>
</html>
